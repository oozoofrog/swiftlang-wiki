site_name: Swift Compiler Wiki
site_url: https://oozoofrog.dev/swiftlang-wiki/
site_description: Swift와 Swift Compiler 전체 지식 위키 — 118 pages, LLM-generated knowledge base
repo_url: https://github.com/oozoofrog/swiftlang-wiki
repo_name: oozoofrog/swiftlang-wiki
edit_uri: edit/main/pages/

docs_dir: pages
site_dir: site

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ko
  - roamlinks
  - obsidian-interactive-graph

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true

